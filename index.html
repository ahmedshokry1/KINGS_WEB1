    <!-- Defensive compatibility fix for browser extensions intercepting window.fetch -->
    <script>
      (function() {
        try {
          var _origFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return _origFetch; },
            set: function(val) { _origFetch = val; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(e) {
          if (e.filename && e.filename.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
